<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Bloom - Papelaria Personalizada</title>
  <meta name="description" content="Studio Bloom - Papelaria personalizada e livros de colorir feitos com carinho para momentos especiais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative floating sparkles -->
  <div class="sparkle sparkle-1">✦</div>
  <div class="sparkle sparkle-2">✧</div>
  <div class="sparkle sparkle-3">✦</div>
  <div class="sparkle sparkle-4">✧</div>
  <div class="sparkle sparkle-5">✦</div>
  <div class="sparkle sparkle-6">✧</div>
  <div class="sparkle sparkle-7">✦</div>
  <div class="sparkle sparkle-8">✧</div>
  <div class="sparkle sparkle-9">✦</div>
  <div class="sparkle sparkle-10">✧</div>

  <!-- Decorative dotted path -->
  <svg class="dotted-path dotted-path-left" viewBox="0 0 100 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M90 0 Q10 60 50 120 Q90 180 30 200" stroke="#dbbae3" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" fill="none" opacity="0.5"/>
  </svg>
  <svg class="dotted-path dotted-path-right" viewBox="0 0 100 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M10 0 Q90 60 50 120 Q10 180 70 200" stroke="#dbbae3" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" fill="none" opacity="0.5"/>
  </svg>

  <!-- Butterflies -->
  <img src="assets/butterfly.png" alt="" class="butterfly butterfly-left" aria-hidden="true">
  <img src="assets/butterfly.png" alt="" class="butterfly butterfly-right" aria-hidden="true">
  <img src="assets/butterfly.png" alt="" class="butterfly butterfly-bottom-left" aria-hidden="true">
  <img src="assets/butterfly.png" alt="" class="butterfly butterfly-bottom-right" aria-hidden="true">

  <main class="container">
    <!-- Logo Section -->
    <section class="logo-section">
      <div class="logo-glow"></div>
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="Studio Bloom Logo" class="logo" id="logo">
      </div>
    </section>

    <!-- Description Section -->
    <section class="description-section">
      <p class="description" id="description">
        Papelaria personalizada e livros de colorir<br>
        feitos com carinho para momentos especiais.
      </p>
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-star">✦</span>
        <span class="divider-line"></span>
      </div>
    </section>

    <!-- CTA Section -->
    <section class="cta-section">
      <h1 class="cta-title" id="cta-title">Escolha onde prefere comprar:</h1>
    </section>
  </main>

  <!-- Links Section (outside container for full width) -->
  <section class="links-section">
    <div class="links-bg">
      <div class="links-container">
        <!-- TikTok Shop -->
        <a href="#" class="link-card" id="link-tiktok" aria-label="Compre pelo TikTok Shop">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.2a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.73a8.19 8.19 0 0 0 4.76 1.53V6.81a4.85 4.85 0 0 1-1-.12z" fill="#590852"/>
            </svg>
          </div>
          <span class="link-text">COMPRE PELO TIKTOK SHOP</span>
          <div class="link-arrow">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M9 6l6 6-6 6" stroke="#590852" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>

        <!-- Shopee -->
        <a href="#" class="link-card" id="link-shopee" aria-label="Compre pela Shopee">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" stroke="#590852" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="3" y1="6" x2="21" y2="6" stroke="#590852" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 10a4 4 0 0 1-8 0" stroke="#590852" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="link-text">COMPRE PELA SHOPEE</span>
          <div class="link-arrow">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M9 6l6 6-6 6" stroke="#590852" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>

        <!-- WhatsApp -->
        <a href="#" class="link-card" id="link-whatsapp" aria-label="Fale conosco pelo WhatsApp">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="#590852"/>
            </svg>
          </div>
          <span class="link-text">FALE CONOSCO PELO WHATSAPP</span>
          <div class="link-arrow">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M9 6l6 6-6 6" stroke="#590852" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
